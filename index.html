<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESPOL Materiales - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100%;
      /* Usamos la imagen completa de fondo */
      background-image: url('FONDO INICIAL.jpeg');
      background-size: cover;
      background-position: left center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end; /* Alinea la tarjeta de login a la derecha */
      padding: 40px 6% 20px 40px;
      position: relative;
    }

    /* Tarjeta de Login a la derecha */
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08), 0 4px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid #edf2f7;
      margin-top: 20px;
    }

    .login-card h2 {
      font-size: 26px;
      font-weight: 700;
      color: #0b1f3a;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.icon-left {
      position: absolute;
      left: 14px;
      width: 17px;
      height: 17px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
    }

    .input-wrapper input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #002855;
      box-shadow: 0 0 0 3px rgba(0, 40, 85, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      color: #94a3b8;
    }

    .forgot-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 7px;
    }

    .forgot-link a {
      font-size: 12px;
      color: #002855;
      text-decoration: underline;
      font-weight: 500;
    }

    .btn-submit {
      width: 100%;
      margin-top: 22px;
      background-color: #002855;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #001a38;
    }

    .signup-row {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
    }

    .signup-row a {
      color: #002855;
      font-weight: 700;
      text-decoration: underline;
      margin-left: 4px;
    }

    .community-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      color: #64748b;
      font-size: 12.5px;
    }

    .community-badge svg {
      width: 15px;
      height: 15px;
      color: #10b981;
    }

    .academic-footer {
      align-self: flex-end;
      font-size: 11px;
      color: #64748b;
      margin-top: auto;
      padding-top: 20px;
    }

    @media (max-width: 820px) {
      body {
        align-items: center;
        padding: 30px 20px;
        background-position: center;
      }
      .academic-footer {
        align-self: center;
      }
    }
  </style>
</head>
<body>

  <!-- Tarjeta a la derecha -->
  <main class="login-card">
    <h2>Bienvenido</h2>
    <p class="subtitle">Encuentra lo que necesitas para tu próximo proyecto.</p>

    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label for="email">Correo institucional</label>
        <div class="input-wrapper">
          <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <input type="email" id="email" placeholder="usuario@espol.edu.ec" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" placeholder="••••••••••••" required />
          <button type="button" class="password-toggle" id="togglePassword">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="forgot-link">
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </div>

      <button type="submit" class="btn-submit">Iniciar sesión</button>

      <div class="signup-row">
        ¿Primera vez aquí? <a href="#">Crear cuenta</a>
      </div>

      <div class="community-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>Conecta con tu comunidad universitaria.</span>
      </div>
    </form>
  </main>

  <div class="academic-footer">
    Prototipo académico
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
    });
  </script>
</body>
</html>
