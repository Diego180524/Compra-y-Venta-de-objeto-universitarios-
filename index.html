<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESPOL Materiales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Lienzo con la proporción exacta de tu imagen */
    .viewport-canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1920px;
      overflow: hidden;
    }

    /* La imagen de fondo se ajusta completa sin cortes */
    .bg-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
    }

    /* Tarjeta de bienvenida calcada a la derecha */
    .login-container {
      position: absolute;
      top: 50%;
      right: 5%;
      transform: translateY(-50%);
      z-index: 10;
      width: 380px;
      max-width: 90%;
    }

    .login-card {
      background: #ffffff;
      padding: 30px 26px;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 700;
      color: #0b1f3a;
      margin-bottom: 4px;
    }

    .login-card .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.icon-left {
      position: absolute;
      left: 11px;
      width: 15px;
      height: 15px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
    }

    .input-wrapper input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #002855;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      color: #94a3b8;
    }

    .forgot-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .forgot-link a {
      font-size: 11px;
      color: #002855;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      margin-top: 16px;
      background-color: #002855;
      color: #ffffff;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #001a38;
    }

    .signup-row {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }

    .signup-row a {
      color: #002855;
      font-weight: 700;
      text-decoration: underline;
      margin-left: 3px;
    }

    .community-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      color: #64748b;
      font-size: 11.5px;
    }

    .community-badge svg {
      width: 14px;
      height: 14px;
      color: #10b981;
    }

    .academic-footer {
      position: absolute;
      bottom: 12px;
      right: 25px;
      font-size: 10.5px;
      color: #94a3b8;
      z-index: 10;
    }

    @media (max-width: 850px) {
      .login-container {
        position: relative;
        top: auto;
        right: auto;
        transform: none;
        margin: auto;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-canvas">
    <!-- Tu imagen de fondo original con logo y textos incluidos -->
    <img src="FONDO INICIAL.jpeg" alt="Fondo ESPOL Materiales" class="bg-full">

    <!-- Card de Login alineada a la derecha -->
    <div class="login-container">
      <main class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Encuentra lo que necesitas para tu próximo proyecto.</p>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <div class="form-group">
            <label for="email">Correo institucional</label>
            <div class="input-wrapper">
              <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
              <input type="email" id="email" placeholder="usuario@espol.edu.ec" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="password" placeholder="••••••••••••" required />
              <button type="button" class="password-toggle" id="togglePassword">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="forgot-link">
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>

          <div class="signup-row">
            ¿Primera vez aquí? <a href="#">Crear cuenta</a>
          </div>

          <div class="community-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Conecta con tu comunidad universitaria.</span>
          </div>
        </form>
      </main>
    </div>

    <div class="academic-footer">
      Prototipo académico
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
