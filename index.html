<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMarket - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Conectado al CSS centralizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="body-auth">

  <img src="FONDO INICIAL.jpeg" alt="Fondo CampusMarket" class="bg-full">

  <div class="viewport-canvas">

    <div class="login-wrapper">
      
      <!-- Llamada a tu imagen de logo -->
      <a href="#" class="brand-top-center">
        <img src="CAMPUS.jpg" alt="CampusMarket" class="logo-img">
      </a>

      <main class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Encuentra lo que necesitas para tu próximo proyecto.</p>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <div class="form-group">
            <label for="email">Correo institucional</label>
            <div class="input-wrapper">
              <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
              <input type="email" id="email" placeholder="usuario@espol.edu.ec" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="password" placeholder="••••••••••••" required />
              <button type="button" class="password-toggle" id="togglePassword">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="forgot-link">
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>

          <div class="signup-row">
            ¿Primera vez aquí? <a href="registro.html">Crear cuenta</a>
          </div>

          <div class="community-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Conecta con tu comunidad universitaria.</span>
          </div>
        </form>
      </main>
    </div>

    <div class="academic-footer">
      Prototipo académico
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
