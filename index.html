<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMarket - Iniciar Sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 85% 15%, #fef3c7 0%, transparent 40%),
                  radial-gradient(circle at 10% 90%, #e0f2fe 0%, transparent 35%),
                  linear-gradient(135deg, #0b1f3a 0%, #002855 50%, #0f172a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .viewport-canvas {
      position: relative;
      width: 100%;
      max-width: 1440px;
      height: 92vh;
      max-height: 850px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
    }

    .bg-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
      z-index: 1;
    }

    .login-wrapper {
      position: absolute;
      top: 50%;
      right: 36px;
      transform: translateY(-50%);
      z-index: 10;
      width: 360px;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LOGOTIPO REPOSICIONADO SOBRE LA TARJETA */
    .brand-top-center {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 20px 10px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      backdrop-filter: blur(8px);
      margin-bottom: 24px; /* Espacio entre el logo y la tarjeta de login */
    }

    .brand-text-container {
      display: flex;
      flex-direction: column;
    }

    .brand-logo-text {
      font-size: 26px;
      font-weight: 800;
      color: #002855;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-logo-text span {
      color: #0284c7;
    }

    .brand-subtitle {
      font-size: 9.5px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 40, 85, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.9);
      width: 100%;
    }

    .login-card h2 {
      font-size: 22px;
      font-weight: 800;
      color: #0b1f3a;
      margin-bottom: 4px;
    }

    .login-card .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.icon-left {
      position: absolute;
      left: 11px;
      width: 15px;
      height: 15px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
    }

    .input-wrapper input {
      width: 100%;
      padding: 9.5px 12px 9.5px 34px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #002855;
      box-shadow: 0 0 0 3px rgba(0, 40, 85, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      color: #94a3b8;
    }

    .forgot-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .forgot-link a {
      font-size: 11px;
      color: #002855;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(135deg, #002855 0%, #001f42 100%);
      color: #ffffff;
      padding: 11.5px;
      border: none;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 40, 85, 0.25);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: #001530;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 40, 85, 0.35);
    }

    .signup-row {
      text-align: center;
      margin-top: 13px;
      font-size: 12px;
      color: #64748b;
    }

    .signup-row a {
      color: #002855;
      font-weight: 700;
      text-decoration: underline;
      margin-left: 3px;
    }

    .community-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
      padding-top: 11px;
      border-top: 1px solid #f1f5f9;
      color: #64748b;
      font-size: 11px;
    }

    .community-badge svg {
      width: 14px;
      height: 14px;
      color: #10b981;
    }

    .academic-footer {
      position: absolute;
      bottom: 12px;
      right: 24px;
      font-size: 10.5px;
      color: #94a3b8;
      z-index: 10;
    }

    @media (max-width: 880px) {
      body {
        padding: 0;
      }

      .viewport-canvas {
        height: 100vh;
        border-radius: 0;
      }

      .login-wrapper {
        position: relative;
        top: auto;
        right: auto;
        transform: none;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <div class="viewport-canvas">
    <img src="FONDO INICIAL.jpeg" alt="Fondo CampusMarket" class="bg-full">

    <div class="login-wrapper">

      <!-- LOGO MOVIDO ARRIBA DE "BIENVENIDO" -->
      <a href="#" class="brand-top-center">
        <svg width="45" height="45" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

          <!-- Líneas de velocidad traseras -->
          <path d="M 5 58 L 22 58 M 12 68 L 30 68 M 18 78 L 26 78" stroke="#002855" stroke-width="4.5" stroke-linecap="round"/>

          <!-- Estructura del carrito -->
          <path d="M 23 38 L 32 38 L 44 80 L 85 80 L 96 42 L 35 42" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- Ruedas -->
          <circle cx="50" cy="92" r="6.5" fill="#002855"/>
          <circle cx="78" cy="92" r="6.5" fill="#002855"/>

          <!-- Libro abierto interior -->
          <path d="M 46 42 L 43 27 Q 56 22 64 29 Q 73 22 86 27 L 83 42" fill="none" stroke="#002855" stroke-width="4.5" stroke-linejoin="round"/>
          <line x1="64" y1="29" x2="64" y2="45" stroke="#002855" stroke-width="4.5"/>

          <!-- Birrete universitario superior -->
          <polygon points="64,8 41,16 64,24 87,16" fill="#0284c7"/>
          <path d="M 48,19 V 27 L 64,32 L 80,27 V 19" fill="none" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>

        </svg>

        <div class="brand-text-container">
          <span class="brand-logo-text">Campus<span>Market</span></span>
          <span class="brand-subtitle">Compra y vende en tu universidad</span>
        </div>
      </a>

      <main class="login-card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Encuentra lo que necesitas para tu próximo proyecto.</p>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">

          <div class="form-group">
            <label for="email">Correo institucional</label>

            <div class="input-wrapper">
              <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>

              <input type="email" id="email" placeholder="usuario@espol.edu.ec" required />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>

            <div class="input-wrapper">
              <svg class="icon-left" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>

              <input type="password" id="password" placeholder="••••••••••••" required />

              <button type="button" class="password-toggle" id="togglePassword">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <div class="forgot-link">
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>

          <div class="signup-row">
            ¿Primera vez aquí? <a href="registro.html">Crear cuenta</a>
          </div>

          <div class="community-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>

            <span>Conecta con tu comunidad universitaria.</span>
          </div>

        </form>
      </main>
    </div>

    <div class="academic-footer">
      Prototipo académico
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    });
  </script>

</body>
</html>
