<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMarket - Mapa del Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Conectado al CSS centralizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="body-map">

  <div class="top-panel">
    <a href="dashboard.html" class="btn-back">
      ← Volver al Catálogo
    </a>
    <div class="badge-info">
      📍 Entregas en vivo dentro del Campus ESPOL
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Coordenadas ESPOL Prosperina
    const espolCoords = [-2.1465, -79.9660];

    const map = L.map('map').setView(espolCoords, 16);

    // Servidor de Google Maps original (mosaicos de calles, áreas y edificios de Google)
    L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }).addTo(map);

    // Artículos en campus
    const itemsOnCampus = [
      {
        title: "Multímetro digital",
        price: "$18",
        spot: "Entrega: Bloque FIEC (Laboratorios)",
        seller: "Ana M.",
        phone: "593987654321",
        coords: [-2.1450, -79.9675],
        img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400"
      },
      {
        title: "Cautín con soporte",
        price: "$8",
        spot: "Entrega: Talleres FIMCP",
        seller: "Luis R.",
        phone: "593987654322",
        coords: [-2.1482, -79.9650],
        img: "https://images.unsplash.com/photo-1597733336794-12d05021d510?w=400"
      },
      {
        title: "Calculadora Casio fx-991LA",
        price: "$18",
        spot: "Entrega: Biblioteca Central / FCNM",
        seller: "Diego",
        phone: "593987654320",
        coords: [-2.1462, -79.9645],
        img: "https://images.unsplash.com/photo-1587145820266-a5951ee6f620?w=400"
      },
      {
        title: "Set de dibujo técnico",
        price: "$10",
        spot: "Entrega: Comedor FADCOM",
        seller: "Daniela V.",
        phone: "593987654324",
        coords: [-2.1438, -79.9632],
        img: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=400"
      }
    ];

    itemsOnCampus.forEach(item => {
      const customIcon = L.divIcon({
        className: 'custom-pin-wrapper',
        html: `
          <div class="custom-marker">
            <div class="marker-card">
              <img src="${item.img}" class="marker-thumb" alt="${item.title}" />
              <span class="marker-price">${item.price}</span>
            </div>
            <div class="marker-arrow"></div>
          </div>
        `,
        iconSize: [50, 60],
        iconAnchor: [25, 60]
      });

      const popupContent = `
        <div class="popup-box">
          <img src="${item.img}" alt="${item.title}">
          <h4>${item.title}</h4>
          <div class="spot">📍 ${item.spot}</div>
          <div class="price">${item.price}</div>
          <a href="https://wa.me/${item.phone}?text=Hola%20${encodeURIComponent(item.seller)},%20vi%20tu%20${encodeURIComponent(item.title)}%20en%20el%20mapa%20de%20ESPOL" target="_blank" class="popup-btn">
            Contactar por WhatsApp
          </a>
        </div>
      `;

      L.marker(item.coords, { icon: customIcon })
        .addTo(map)
        .bindPopup(popupContent);
    });
  </script>
</body>
</html>
