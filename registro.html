<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta - CampusMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Conectado al CSS centralizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="body-auth">

  <!-- Llamada a tu imagen de fondo -->
  <img src="FONDO CREAR.jpg" alt="Fondo CampusMarket" class="bg-full">

  <div class="viewport-canvas">
    
    <!-- Llamada a tu imagen de logo -->
    <a href="index.html" class="brand-top-center">
      <img src="CAMPUS.jpg" alt="CampusMarket" class="logo-img">
    </a>

    <main class="register-card">
      <div class="avatar-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      
      <h2>Crea tu cuenta</h2>
      <p class="subtitle">Solo para estudiantes de Guayaquil</p>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="fullName" placeholder="Tus nombres y apellidos" required />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            <select id="uniSelect" onchange="updateEmailPlaceholder()" required>
              <option value="" disabled selected>Selecciona tu Universidad</option>
              <option value="espol">ESPOL</option>
              <option value="ug">Universidad de Guayaquil (UG)</option>
              <option value="ucsg">Universidad Católica (UCSG)</option>
              <option value="uees">Universidad Espíritu Santo (UEES)</option>
              <option value="ups">Politécnica Salesiana (UPS)</option>
              <option value="ecotec">Universidad ECOTEC</option>
              <option value="uartes">Universidad de las Artes (UArtes)</option>
              <option value="otra">Otra en Guayaquil / Samborondón</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            <input type="email" id="email" placeholder="Correo institucional" required />
          </div>
        </div>

        <div class="password-grid">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="password" placeholder="Contraseña" required />
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="confirmPassword" placeholder="Confirmar" required />
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <label class="terms-row">
          <input type="checkbox" required>
          <span>Acepto los <a href="#">Términos y Condiciones</a></span>
        </label>

        <button type="submit" class="btn-submit">Crear cuenta</button>

        <div class="login-link">
          ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
        </div>
      </form>
    </main>
  </div>

  <div class="academic-footer">
    CampusMarket • Prototipo Académico
  </div>

  <script>
    // Cambia el placeholder del correo
    function updateEmailPlaceholder() {
      const uni = document.getElementById('uniSelect').value;
      const emailInput = document.getElementById('email');
      
      const domains = {
        'espol': 'usuario@espol.edu.ec',
        'ug': 'usuario@ug.edu.ec',
        'ucsg': 'usuario@cu.ucsg.edu.ec',
        'uees': 'usuario@uees.edu.ec',
        'ups': 'usuario@est.ups.edu.ec',
        'ecotec': 'usuario@ecotec.edu.ec',
        'uartes': 'usuario@uartes.edu.ec',
        'otra': 'usuario@institucion.edu.ec'
      };

      if (domains[uni]) {
        emailInput.placeholder = domains[uni];
      }
    }

    // Funcionalidad para el botón del ojito
    function togglePasswordVisibility(fieldId) {
      const input = document.getElementById(fieldId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>
</body>
</html>
