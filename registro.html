<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta - CampusMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #001529; /* Color de respaldo */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .bg-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .viewport-canvas {
      position: relative;
      width: 100%;
      max-width: 480px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-top-center {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      margin-bottom: 24px;
      transition: transform 0.2s;
    }

    .brand-top-center:hover {
      transform: translateY(-2px);
    }
    
    .logo-img {
      height: 65px; /* Ajusta este valor si lo quieres más grande o pequeño */
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .register-card {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px);
      padding: 32px 28px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #002855 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 6px 14px rgba(2, 132, 199, 0.25);
    }

    .avatar-icon svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .register-card h2 {
      font-size: 21px;
      font-weight: 800;
      color: #0b1f3a;
      margin-bottom: 4px;
      text-align: center;
    }

    .register-card .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 24px;
      text-align: center;
    }

    form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 14px;
      width: 100%;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.icon-left {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
    }

    .input-wrapper input, .input-wrapper select {
      width: 100%;
      padding: 11px 12px 11px 38px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13.5px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
      background: #ffffff;
      appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
    }

    .input-wrapper input:focus, .input-wrapper select:focus {
      border-color: #002855;
      box-shadow: 0 0 0 3px rgba(0, 40, 85, 0.1);
    }

    .password-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .password-grid .input-wrapper svg.icon-left {
      left: 10px;
    }

    .password-grid .input-wrapper input {
      padding-left: 32px;
    }

    .terms-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: #475569;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .terms-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #002855;
      cursor: pointer;
    }

    .terms-row a {
      color: #0284c7;
      font-weight: 700;
      text-decoration: none;
    }

    .terms-row a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #002855 0%, #001f42 100%);
      color: #ffffff;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 40, 85, 0.25);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: #001530;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 40, 85, 0.35);
    }

    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 12.5px;
      color: #64748b;
    }

    .login-link a {
      color: #002855;
      font-weight: 700;
      text-decoration: underline;
      margin-left: 3px;
    }

    .academic-footer {
      position: absolute;
      bottom: 12px;
      text-align: center;
      width: 100%;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.4);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Llamada a tu nueva imagen de fondo -->
  <img src="FONDO CREAR.jpg" alt="Fondo CampusMarket" class="bg-full">

  <div class="viewport-canvas">
    
    <!-- Llamada a tu nueva imagen de logo -->
    <a href="index.html" class="brand-top-center">
      <img src="CAMPUS.jpg" alt="CampusMarket" class="logo-img">
    </a>

    <main class="register-card">
      <div class="avatar-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      
      <h2>Crea tu cuenta</h2>
      <p class="subtitle">Solo para estudiantes de Guayaquil</p>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="fullName" placeholder="Tus nombres y apellidos" required />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            <select id="uniSelect" onchange="updateEmailPlaceholder()" required>
              <option value="" disabled selected>Selecciona tu Universidad</option>
              <option value="espol">ESPOL</option>
              <option value="ug">Universidad de Guayaquil (UG)</option>
              <option value="ucsg">Universidad Católica (UCSG)</option>
              <option value="uees">Universidad Espíritu Santo (UEES)</option>
              <option value="ups">Politécnica Salesiana (UPS)</option>
              <option value="ecotec">Universidad ECOTEC</option>
              <option value="uartes">Universidad de las Artes (UArtes)</option>
              <option value="otra">Otra en Guayaquil / Samborondón</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            <input type="email" id="email" placeholder="Correo institucional" required />
          </div>
        </div>

        <div class="password-grid">
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="password" placeholder="Contraseña" required />
          </div>
          <div class="input-wrapper">
            <svg class="icon-left" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="confirmPassword" placeholder="Confirmar" required />
          </div>
        </div>

        <label class="terms-row">
          <input type="checkbox" required>
          <span>Acepto los <a href="#">Términos y Condiciones</a></span>
        </label>

        <button type="submit" class="btn-submit">Crear cuenta</button>

        <div class="login-link">
          ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
        </div>
      </form>
    </main>
  </div>

  <div class="academic-footer">
    CampusMarket • Prototipo Académico
  </div>

  <script>
    function updateEmailPlaceholder() {
      const uni = document.getElementById('uniSelect').value;
      const emailInput = document.getElementById('email');
      
      const domains = {
        'espol': 'usuario@espol.edu.ec',
        'ug': 'usuario@ug.edu.ec',
        'ucsg': 'usuario@cu.ucsg.edu.ec',
        'uees': 'usuario@uees.edu.ec',
        'ups': 'usuario@est.ups.edu.ec',
        'ecotec': 'usuario@ecotec.edu.ec',
        'uartes': 'usuario@uartes.edu.ec',
        'otra': 'usuario@institucion.edu.ec'
      };

      if (domains[uni]) {
        emailInput.placeholder = domains[uni];
      }
    }
  </script>
</body>
</html>
